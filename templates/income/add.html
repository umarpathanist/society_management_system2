{% extends "layout/base.html" %}
{% block title %}Record Income | SocietyHQ{% endblock %}

{% block content %}
<!-- HEADER SECTION -->
<div class="page-header" style="margin-bottom: 30px;">
    <h1>💰 Record New Income</h1>
    <!-- This will now show the actual name like 'Al Burroj 2' -->
    <p style="color: #64748b; font-weight: 500;">
        Building: <strong style="color: #4e46e5;">{{ society_name }}</strong>
    </p>
</div>

<div class="card" style="background: white; border-radius: 20px; padding: 40px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); max-width: 600px; margin-top: 20px; border: 1px solid #f1f5f9;">
    
    <form method="POST">
        
        <!-- HIDDEN SOCIETY ID: Essential for the backend logic -->
        <input type="hidden" name="society_id" value="{{ society_id}}">

        <!-- Source Type -->
        <div style="margin-bottom: 25px;">
            <label style="display: block; margin-bottom: 8px; font-weight: 700; font-size: 13px; color: #374151; text-transform: uppercase; letter-spacing: 0.5px;">Source Type</label>
            <input type="text" name="source_name" required placeholder="e.g. Donation, Parking Penalty" 
                   style="width: 100%; padding: 12px 16px; border: 1.5px solid #e2e8f0; border-radius: 12px; font-size: 15px; outline: none; transition: border-color 0.2s; box-sizing: border-box;">
        </div>

        <!-- Amount -->
        <div style="margin-bottom: 25px;">
            <label style="display: block; margin-bottom: 8px; font-weight: 700; font-size: 13px; color: #374151; text-transform: uppercase; letter-spacing: 0.5px;">Amount (₹)</label>
            <input type="number" name="amount" required step="0.01" placeholder="0.00" 
                   style="width: 100%; padding: 12px 16px; border: 1.5px solid #e2e8f0; border-radius: 12px; font-size: 15px; outline: none; box-sizing: border-box;">
        </div>

        <!-- Income Date -->
        <div style="margin-bottom: 25px;">
            <label style="display: block; margin-bottom: 8px; font-weight: 700; font-size: 13px; color: #374151; text-transform: uppercase; letter-spacing: 0.5px;">Transaction Date</label>
            <input type="date" name="income_date" required 
                   style="width: 100%; padding: 12px 16px; border: 1.5px solid #e2e8f0; border-radius: 12px; font-size: 15px; outline: none; box-sizing: border-box; background: white; cursor: pointer;">
        </div>

        <!-- Description -->
        <div style="margin-bottom: 35px;">
            <label style="display: block; margin-bottom: 8px; font-weight: 700; font-size: 13px; color: #374151; text-transform: uppercase; letter-spacing: 0.5px;">Additional Description</label>
            <textarea name="description" rows="3" placeholder="Optional notes about this transaction..." 
                      style="width: 100%; padding: 12px 16px; border: 1.5px solid #e2e8f0; border-radius: 12px; font-size: 15px; outline: none; resize: none; box-sizing: border-box;"></textarea>
        </div>

        <!-- Form Actions -->
        <div style="display: flex; gap: 15px; align-items: center;">
            <button type="submit" style="background: #4e46e5; color: white; border: none; padding: 15px 30px; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 15px; flex: 2; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2); transition: all 0.2s;">
                Save Income Record
            </button>
            
            <a href="{{ url_for('income.list_income', society_id=society_id) }}" 
               style="flex: 1; text-align: center; color: #64748b; text-decoration: none; font-weight: 600; font-size: 15px; padding: 15px; border: 1.5px solid #e2e8f0; border-radius: 12px; transition: background 0.2s;">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
