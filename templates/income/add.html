{% extends "layout/base.html" %}
{% block title %}Record Income{% endblock %}

{% block content %}
<div class="page-header" style="margin-bottom: 30px;">
    <h1>💰 Record New Income</h1>
    <p style="color: #64748b;">Generating record for Society ID: <strong>{{ society_id if society_id else session.society_id }}</strong></p>
</div>

<div class="card" style="background: white; border-radius: 16px; padding: 35px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); max-width: 600px; margin-top: 20px; border: 1px solid #f1f5f9;">
    <form method="POST">
        
        <!-- Society Dropdown (Only for Super Admin) -->
        {% if session.user.role == 'super_admin' %}
        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 8px; font-weight: 700; font-size: 14px; color: #374151;">Target Society</label>
            <select name="society_id" required style="width: 100%; padding: 12px; border: 1.5px solid #e2e8f0; border-radius: 12px; background: white; outline: none;">
                <option value="">-- Choose Society --</option>
                {% for s in societies %}
                    <option value="{{ s.id }}">{{ s.name }}</option>
                {% endfor %}
            </select>
        </div>
        {% endif %}

        <!-- Source Type -->
        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 8px; font-weight: 700; font-size: 14px; color: #374151;">Source Type</label>
            <input type="text" name="source_name" required placeholder="e.g. Donation, Parking Penalty" 
                   style="width: 100%; padding: 12px; border: 1.5px solid #e2e8f0; border-radius: 12px; font-size: 15px; outline: none; box-sizing: border-box;">
        </div>

        <!-- Amount -->
        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 8px; font-weight: 700; font-size: 14px; color: #374151;">Amount (₹)</label>
            <input type="number" name="amount" required step="0.01" placeholder="0.00" 
                   style="width: 100%; padding: 12px; border: 1.5px solid #e2e8f0; border-radius: 12px; font-size: 15px; outline: none; box-sizing: border-box;">
        </div>

        <!-- NEW: DATE FIELD -->
        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 8px; font-weight: 700; font-size: 14px; color: #374151;">Income Date</label>
            <input type="date" name="income_date" required 
                   style="width: 100%; padding: 12px; border: 1.5px solid #e2e8f0; border-radius: 12px; font-size: 15px; outline: none; box-sizing: border-box; background: white; cursor: pointer;">
        </div>

        <!-- Description -->
        <div style="margin-bottom: 30px;">
            <label style="display: block; margin-bottom: 8px; font-weight: 700; font-size: 14px; color: #374151;">Description</label>
            <textarea name="description" rows="3" placeholder="Optional notes..." 
                      style="width: 100%; padding: 12px; border: 1.5px solid #e2e8f0; border-radius: 12px; font-size: 15px; outline: none; resize: none; box-sizing: border-box;"></textarea>
        </div>

        <div style="display: flex; gap: 15px; align-items: center;">
            <button type="submit" style="background: #4e46e5; color: white; border: none; padding: 14px 30px; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 15px; flex: 2; box-shadow: 0 4px 10px rgba(78, 70, 229, 0.2);">
                Save Income Record
            </button>
            <a href="{{ url_for('income.list_income') }}" style="flex: 1; text-align: center; color: #64748b; text-decoration: none; font-weight: 600;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
