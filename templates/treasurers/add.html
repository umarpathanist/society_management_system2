{% extends "layout/base.html" %}
{% block title %}Add Treasurer | SocietyHQ{% endblock %}

{% block content %}
<style>
    .page-wrap {
        max-width: 580px;
        margin: 0 auto;
        padding: 0 16px;
    }

    .page-title {
        font-size: 26px;
        font-weight: 800;
        color: #0f172a;
        margin-bottom: 6px;
        letter-spacing: -0.5px;
    }

    .page-subtitle {
        color: #64748b;
        font-size: 14px;
        margin-bottom: 30px;
    }

    .form-card {
        background: white;
        border-radius: 24px;
        padding: 40px;
        box-shadow: 0 10px 30px -5px rgba(0,0,0,0.05),
                    0 4px 6px -2px rgba(0,0,0,0.02);
        border: 1px solid #f1f5f9;
    }

    .form-group {
        margin-bottom: 24px;
    }

    .form-group label {
        display: block;
        font-size: 11px;
        font-weight: 700;
        color: #475569;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        margin-bottom: 10px;
    }

    .form-control {
        width: 100%;
        padding: 13px 16px;
        background: #f8fafc;
        border: 2px solid #f1f5f9;
        border-radius: 14px;
        font-size: 15px;
        color: #1e293b;
        outline: none;
        transition: all 0.2s;
        box-sizing: border-box;
    }

    .form-control:focus {
        background: white;
        border-color: #4e46e5;
        box-shadow: 0 0 0 4px rgba(78,70,229,0.1);
    }

    .form-control::placeholder {
        color: #cbd5e1;
    }

    .form-control[readonly] {
        background: #f1f5f9;
        color: #94a3b8;
        cursor: not-allowed;
        border-color: #e2e8f0;
    }

    .input-icon-wrap {
        position: relative;
    }

    .input-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 16px;
        pointer-events: none;
    }

    .input-icon + .form-control {
        padding-left: 42px;
    }

    .divider {
        height: 1px;
        background: #f1f5f9;
        margin: 30px 0;
    }

    .form-actions {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
    }

    .btn-save {
        background: linear-gradient(135deg, #6366f1 0%, #4e46e5 100%);
        color: white;
        border: none;
        padding: 14px 32px;
        border-radius: 14px;
        cursor: pointer;
        font-weight: 700;
        font-size: 15px;
        box-shadow: 0 8px 16px -4px rgba(79,70,229,0.4);
        transition: all 0.2s;
        flex: 1;
    }

    .btn-save:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 20px -4px rgba(79,70,229,0.5);
    }

    .btn-cancel {
        padding: 14px 24px;
        color: #64748b;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
        border-radius: 14px;
        background: #f1f5f9;
        transition: all 0.2s;
        text-align: center;
    }

    .btn-cancel:hover {
        background: #e2e8f0;
        color: #1e293b;
    }

    .role-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: #eef2ff;
        color: #4e46e5;
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 700;
        margin-bottom: 24px;
    }

    @media (max-width: 480px) {
        .form-card { padding: 24px 18px; }
        .form-actions { flex-direction: column; }
        .btn-save { width: 100%; }
        .btn-cancel { width: 100%; text-align: center; }
        .page-title { font-size: 22px; }
    }
</style>

<div class="page-wrap">

    <h1 class="page-title">👤 Add Treasurer</h1>
    <p class="page-subtitle">Create a new treasurer account and assign them to a society.</p>

    <div class="form-card">

        <div class="role-badge">
            🏦 Treasurer Account
        </div>

        <form method="POST">

            <!-- Full Name -->
            <div class="form-group">
                <label>Full Name</label>
                <div class="input-icon-wrap">
                    <span class="input-icon">👤</span>
                    <input type="text" name="full_name" required
                           placeholder="e.g. Ahmed Khan"
                           class="form-control">
                </div>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label>Email Address</label>
                <div class="input-icon-wrap">
                    <span class="input-icon">📧</span>
                    <input type="email" name="email" required
                           placeholder="treasurer@example.com"
                           autocomplete="off" class="form-control">
                </div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label>Password</label>
                <div class="input-icon-wrap">
                    <span class="input-icon">🔒</span>
                    <input type="password" name="password" required
                           placeholder="Set a strong password"
                           autocomplete="new-password" class="form-control">
                </div>
            </div>

            <!-- Society -->
            <div class="form-group">
                <label>Assign Society</label>
                {% if role == 'super_admin' %}
                    <select name="society_id" required class="form-control">
                        <option value="">-- Select Society --</option>
                        {% for s in societies %}
                            <option value="{{ s.id }}">{{ s.name }}</option>
                        {% endfor %}
                    </select>
                {% else %}
                    <input type="text" value="{{ current_society_name }}"
                           readonly class="form-control">
                {% endif %}
            </div>

            <div class="divider"></div>

            <!-- Actions -->
            <div class="form-actions">
                <button type="submit" class="btn-save">
                    Save Treasurer
                </button>
                <a href="javascript:history.back()" class="btn-cancel">
                    Cancel
                </a>
            </div>

        </form>
    </div>
</div>
{% endblock %}
