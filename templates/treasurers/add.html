{% extends "layout/base.html" %}
{% block title %}Add Treasurer{% endblock %}

{% block content %}
<style>
    .form-page-wrap {
        max-width: 620px;
        width: 100%;
        margin: 0 auto;
        padding: 0 16px;
        box-sizing: border-box;
    }
    .form-card {
        background: white;
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    .form-group {
        margin-bottom: 20px;
    }
    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
        font-size: 14px;
        color: #374151;
    }
    .form-control {
        width: 100%;
        padding: 10px 14px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 15px;
        box-sizing: border-box;
        outline: none;
        transition: border-color 0.2s;
        background: white;
    }
    .form-control:focus {
        border-color: #4e46e5;
        box-shadow: 0 0 0 3px rgba(78,70,229,0.1);
    }
    .form-actions {
        display: flex;
        gap: 15px;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 25px;
    }
    .btn-save {
        background: #4e46e5;
        color: white;
        border: none;
        padding: 12px 28px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 15px;
        transition: background 0.2s;
    }
    .btn-save:hover { background: #4338ca; }
    .btn-cancel {
        padding: 12px 20px;
        color: #6b7280;
        text-decoration: none;
        font-size: 15px;
        font-weight: 500;
    }
    .page-header h1 {
        font-size: 24px;
        margin-bottom: 20px;
        color: #1f2937;
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
        .form-card { padding: 20px 16px; }
        .form-actions { flex-direction: column; align-items: stretch; }
        .btn-save { text-align: center; }
        .btn-cancel { text-align: center; }
        .page-header h1 { font-size: 20px; }
    }
</style>

<div class="form-page-wrap">
    <div class="page-header">
        <h1>👤 Add Treasurer</h1>
    </div>

    <div class="form-card">
        <form method="POST">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="full_name" required placeholder="Enter full name" class="form-control">
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" required placeholder="email@example.com" autocomplete="off" class="form-control">
            </div>

            <div class="form-group">
                <label>Set Password</label>
                <input type="password" name="password" required placeholder="Enter password" autocomplete="new-password" class="form-control">
            </div>

            <div class="form-group">
                <label>Society</label>
                {% if role == 'super_admin' %}
                    <select name="society_id" required class="form-control">
                        <option value="">-- Select Society --</option>
                        {% for s in societies %}
                            <option value="{{ s.id }}">{{ s.name }}</option>
                        {% endfor %}
                    </select>
                {% else %}
                    <input type="text" value="{{ current_society_name }}" readonly
                           class="form-control" style="background: #f9fafb; color: #6b7280;">
                {% endif %}
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-save">Save</button>
                <a href="javascript:history.back()" class="btn-cancel">Cancel</a>
            </div>

        </form>
    </div>
</div>
{% endblock %}
