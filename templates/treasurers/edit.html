{% extends "layout/base.html" %}
{% block title %}Edit Treasurer{% endblock %}

{% block content %}
<!-- 1. Added Back to List Button at the top -->
<div style="margin-bottom: 20px;">
    <a href="{{ url_for('admin.list_admins') }}" 
       style="text-decoration: none; color: #64748b; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; transition: color 0.2s;"
       onmouseover="this.style.color='#4e46e5'" 
       onmouseout="this.style.color='#64748b'">
        <span style="font-size: 18px;">←</span> Back to List
    </a>
</div>

<div class="page-header" style="margin-bottom: 25px;">
    <h1 style="margin: 0; font-size: 28px; font-weight: 700; color: #1f2937;">📝 Edit Treasurer</h1>
</div>

<div class="card" style="background: white; border-radius: 12px; padding: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); max-width: 600px;">
    <form method="POST">
        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 8px; font-weight: 500;">Full Name</label>
            <input type="text" name="full_name" value="{{ treasurer.full_name }}" required style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; outline: none;">
        </div>

        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 8px; font-weight: 500;">Email Address</label>
            <input type="email" name="email" value="{{ treasurer.email }}" required style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; outline: none;">
        </div>

        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 8px; font-weight: 500;">New Password (leave blank to keep current)</label>
            <input type="password" name="password" autocomplete="new-password" style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; outline: none;">
        </div>

        <div style="margin-bottom: 25px;">
            <label style="display: block; margin-bottom: 8px; font-weight: 500;">Society</label>
            <select name="society_id" required style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; background: white; outline: none;">
                {% for s in societies %}
                    <option value="{{ s.id }}" {% if s.id == treasurer.society_id %}selected{% endif %}>{{ s.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div style="display: flex; gap: 15px; align-items: center;">
            <button type="submit" style="background: #4e46e5; color: white; border: none; padding: 12px 28px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: background 0.2s;">Update</button>
            <a href="{{ url_for('treasurers.list') }}" style="color: #6b7280; text-decoration: none; font-weight: 500;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
