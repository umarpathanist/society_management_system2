{% extends "layout/base.html" %}
{% block title %}Raise Request | SocietyHQ{% endblock %}

{% block content %}
<div class="page-header" style="margin-bottom: 30px;">
    <h1 style="font-size: 24px; color: #111827; display: flex; align-items: center; gap: 12px;">
        <span>🛠️</span> New Maintenance Request
    </h1>
    <p style="color: #64748b; margin-top: 5px;">Describe the issue you're facing, and our team will resolve it.</p>
</div>

<div class="card" style="background: white; border-radius: 24px; padding: 40px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); max-width: 700px; border: 1px solid #f1f5f9;">
    <form method="POST">
        <!-- Title -->
        <div style="margin-bottom: 25px;">
            <label style="display: block; margin-bottom: 8px; font-weight: 700; font-size: 14px; color: #374151;">Short Summary</label>
            <input type="text" name="title" required placeholder="e.g. Water leakage in bathroom" 
                   style="width: 100%; padding: 12px 16px; border: 1.5px solid #e2e8f0; border-radius: 12px; font-size: 15px; outline: none; box-sizing: border-box;">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px;">
            <!-- Category -->
            <div>
                <label style="display: block; margin-bottom: 8px; font-weight: 700; font-size: 14px; color: #374151;">Category</label>
                <select name="category" required style="width: 100%; padding: 12px; border: 1.5px solid #e2e8f0; border-radius: 12px; font-size: 15px; background: white; outline: none; cursor: pointer;">
                    <option value="Plumbing">🚰 Plumbing</option>
                    <option value="Electrical">⚡ Electrical</option>
                    <option value="Carpentry">🪑 Carpentry</option>
                    <option value="Cleaning">🧹 Cleaning</option>
                    <option value="Security">🛡️ Security</option>
                    <option value="Other">📝 Other</option>
                </select>
            </div>
            
            <!-- Priority -->
            <div>
                <label style="display: block; margin-bottom: 8px; font-weight: 700; font-size: 14px; color: #374151;">Urgency Level</label>
                <select name="priority" required style="width: 100%; padding: 12px; border: 1.5px solid #e2e8f0; border-radius: 12px; font-size: 15px; background: white; outline: none; cursor: pointer;">
                    <option value="low">Low</option>
                    <option value="medium" selected>Medium</option>
                    <option value="high">High</option>
                    <option value="urgent">Urgent / Emergency</option>
                </select>
            </div>
        </div>

        <!-- Description -->
        <div style="margin-bottom: 30px;">
            <label style="display: block; margin-bottom: 8px; font-weight: 700; font-size: 14px; color: #374151;">Detailed Description</label>
            <textarea name="description" required placeholder="Please provide specific details like flat number, location, and time of issue..." rows="5"
                      style="width: 100%; padding: 12px 16px; border: 1.5px solid #e2e8f0; border-radius: 12px; font-size: 15px; outline: none; resize: vertical; box-sizing: border-box;"></textarea>
        </div>

        <!-- Action Buttons -->
        <div style="display: flex; gap: 15px; align-items: center;">
            <button type="submit" style="background: #4e46e5; color: white; border: none; padding: 15px 30px; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 15px; flex: 2; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);">
                Submit Request
            </button>
            <a href="{{ url_for('tickets.list_tickets') }}" style="flex: 1; text-align: center; color: #64748b; text-decoration: none; font-weight: 600;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
